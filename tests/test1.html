<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <button id=anchor popovertarget="my-popover" be-buttoned-up> Open Popover </button>

    <div id="my-popover" popover>
    <p>I am a popover with more information.<p>
        <button id=testBtn value=hello>test</button>
    </div>
    <div id=target></div>

    <be-hive>
        <script type=emc src="be-buttoned-up/emc.json"></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
    <script>
        function runScript(){
            anchor.click();
            testBtn.click();
            setTimeout(() => {
                if(anchor.value === 'hello'){
                    target.setAttribute('mark', 'good');
                }
            }, 100);

        }
        setTimeout(() => {
            runScript();
        }, 2000);
    </script>

</body>
</html>
