<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticDeclarativeInSequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- No be-buttoned-up attribute at all -- the enhancement config is
         registered first, then properties are set via the `.set` proxy. -->
    <button id="subject" popovertarget="menu">&#9776;</button>

    <menu id="menu" popover>
        <button id="doSomething" value="doSomething">Do something</button>
        <button id="doSomethingElse" value="doSomethingElse">Do something else</button>
    </menu>
    <output id="selected"></output>
    <script type=module>
        import {defBeButtonedUp} from '/def.js';
        subject.addEventListener('change', () => {
            selected.value = subject.value;
        });
        await defBeButtonedUp(document.body);
        //only the first call needs to use .set
        //it triggers the attachment of the enhancement.
        subject.enh.set.beButtonedUp.eventName = 'click';
    </script>
</body>
</html>
