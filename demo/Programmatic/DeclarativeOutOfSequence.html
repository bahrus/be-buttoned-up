<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative out of sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <button id="button" popovertarget="menu">&#9776;</button>

    <menu id="menu" popover>
        <button id="doSomething" value="doSomething">Do something</button>
        <button id="doSomethingElse" value="doSomethingElse">Do something else</button>
    </menu>
    <output id="selected"></output>
    <script type=module>
        import {defBeButtonedUp} from '/def.js';
        button.addEventListener('change', () => {
            selected.value = button.value;
        });
        //only the first call needs to use .set
        //it triggers the attachment of the enhancement.
        button.enh.set.beButtonedUp.eventName = 'click';
        await defBeButtonedUp(document.body);
        console.log(button.enh.beButtonedUp);
    </script>
</body>
</html>
